# Builds the Poké user guide on every push and pull request, so that a broken page or a
# failing code example is caught before it reaches the site, and publishes the site to
# GitHub Pages after every push to main. The guide documents the released Poké, so the
# workflow installs it from PyPI; until the first release there, every run fails at the
# install step, which is expected.
name: Build and publish the guide

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never publish two versions at once; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the build tools and the released Poké
        run: |
          python -m pip install -r requirements.txt
          python -m pip install poke-scouter

      - name: Build the site, failing on any warning
        run: sphinx-build -E -W --keep-going -b html source build/html

      - name: Run the code examples of the guide
        run: sphinx-build -E -b doctest source build/doctest

      - name: Keep the built site as the artifact to publish
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/html

  publish:
    # Only the main branch goes online; pull requests and other branches stop at the build.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
